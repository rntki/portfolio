<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rena Takii</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="site-header">
    <a class="logo-name" href="index.html" data-site-name>My Name</a>
    <nav>
      <ul class="nav-links" data-nav></ul>
    </nav>
  </header>

  <main class="wrap">

    <section class="hero">
      <h1><span class="wave">👋</span> Hi</h1>
      <p class="rotator-line">I'm <span class="rotator" data-rotator>Name</span></p>
    </section>

    <section class="cards" data-cards></section>

    <section class="worked-at">
      <p class="section-label">I have worked at...</p>
      <div class="logo-grid" data-logos></div>
    </section>

    <section class="recommendation">
      <div class="rec-card reveal" data-recommendation></div>
    </section>

    <section class="spoken-with">
      <p class="section-label">I have spoken with...</p>
      <ul data-spoken-with></ul>
    </section>

  </main>

  <footer class="site-footer">
    <div class="wrap">
      <span class="logo-name" data-site-name>My Name</span>
      <ul class="nav-links" data-footer-nav></ul>
    </div>
  </footer>

  <script src="js/content.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
